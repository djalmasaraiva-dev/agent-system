[project]
name = "agent-system"
version = "0.1.0"
description = "Multi-agent ADK system with cross-platform identity bridge — built on Agent Starter Pack conventions, referencing github.com/google/skills"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Djalma Junior", email = "djalmasaraiva@gmail.com" },
]
license = { text = "Apache-2.0" }
dependencies = [
    # ADK + Vertex AI Agent Engine
    "google-adk>=1.0.0",
    "google-cloud-aiplatform[adk,agent-engines,evaluation]>=1.95.0",
    # Real Google Cloud tools
    "google-cloud-bigquery>=3.25.0",
    "google-auth>=2.35.0",
    # FastAPI server (per Agent Starter Pack)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Pydantic v2
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    # IAP / JWT
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    # Observability — Agent Starter Pack defaults
    "google-cloud-logging>=3.11.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "structlog>=24.4.0",
    # Config
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "watchdog>=5.0.0",
]
load_test = [
    "locust>=2.32.0",
]

[project.scripts]
agent-server = "app.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "watchdog>=5.0.0",
    "locust>=2.32.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # env vars must be set before app.* imports
"tests/**" = ["S105", "S106", "S311"]
"app/agents/prompts.py" = ["RUF001"]  # en-dash is intentional in prompt copy

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["tests/load_test"]

[[tool.mypy.overrides]]
module = [
    "google.adk.*",
    "vertexai.*",
    "google.cloud.*",
    "google.api_core.*",
    "google.genai.*",
    "opentelemetry.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
addopts = "-ra -q --strict-markers"
