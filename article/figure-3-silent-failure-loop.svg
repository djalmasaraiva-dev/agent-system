<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Inter', 'Google Sans', 'Roboto', -apple-system, system-ui, sans-serif">
  <defs>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="panelShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 14 14" refX="7" refY="7" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 2 L 11 7 L 2 12" fill="none" stroke="#4285F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 14 14" refX="7" refY="7" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 2 L 11 7 L 2 12" fill="none" stroke="#F9AB00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 14 14" refX="7" refY="7" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 2 L 11 7 L 2 12" fill="none" stroke="#EA4335" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ============ Background ============ -->
  <rect width="1200" height="760" fill="#FAFBFC"/>

  <!-- ============ Title ============ -->
  <text x="600" y="58" font-size="30" font-weight="600" fill="#202124" text-anchor="middle" letter-spacing="-0.3">Anatomy of a silent agent failure</text>
  <text x="600" y="88" font-size="15" font-style="italic" fill="#5F6368" text-anchor="middle">The bug was small; the ownership gap was structural</text>
  <line x1="540" y1="106" x2="660" y2="106" stroke="#673AB7" stroke-width="3" stroke-linecap="round"/>

  <!-- ============ Timeline cards ============ -->

  <!-- DAY 0 — Agent ships -->
  <g transform="translate(60, 170)">
    <rect width="240" height="180" rx="14" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.6" filter="url(#cardShadow)"/>
    <rect x="20" y="22" width="62" height="22" rx="11" fill="#E8F0FE"/>
    <text x="51" y="37" font-size="11" font-weight="700" fill="#1A73E8" text-anchor="middle" letter-spacing="0.8">DAY 0</text>
    <circle cx="120" cy="78" r="20" fill="#E8F0FE"/>
    <rect x="110" y="68" width="20" height="20" rx="3" fill="none" stroke="#4285F4" stroke-width="1.8"/>
    <path d="M 114 78 L 119 83 L 126 73" fill="none" stroke="#4285F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="124" font-size="18" font-weight="600" fill="#202124" text-anchor="middle">Agent ships</text>
    <text x="120" y="148" font-size="12" fill="#5F6368" text-anchor="middle">Research assistant enters</text>
    <text x="120" y="164" font-size="12" fill="#5F6368" text-anchor="middle">production workflow</text>
  </g>

  <line x1="306" y1="260" x2="334" y2="260" stroke="#4285F4" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- DAYS 1-59 — Bad citations -->
  <g transform="translate(340, 170)">
    <rect width="240" height="180" rx="14" fill="#FFFFFF" stroke="#F9AB00" stroke-width="1.6" filter="url(#cardShadow)"/>
    <rect x="20" y="22" width="92" height="22" rx="11" fill="#FEF7E0"/>
    <text x="66" y="37" font-size="11" font-weight="700" fill="#E37400" text-anchor="middle" letter-spacing="0.8">DAYS 1–59</text>
    <circle cx="120" cy="78" r="20" fill="#FEF7E0"/>
    <path d="M 120 64 L 134 88 L 106 88 Z" fill="none" stroke="#F9AB00" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="120" y1="73" x2="120" y2="80" stroke="#F9AB00" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="120" cy="84" r="1" fill="#F9AB00"/>
    <text x="120" y="124" font-size="18" font-weight="600" fill="#202124" text-anchor="middle">Bad citations</text>
    <text x="120" y="148" font-size="12" fill="#5F6368" text-anchor="middle">Outputs look plausible</text>
    <text x="120" y="164" font-size="12" fill="#5F6368" text-anchor="middle">and pass unnoticed</text>
  </g>

  <line x1="586" y1="260" x2="614" y2="260" stroke="#F9AB00" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowAmber)"/>

  <!-- DAY 60 — Analyst catches it -->
  <g transform="translate(620, 170)">
    <rect width="240" height="180" rx="14" fill="#FFFFFF" stroke="#EA4335" stroke-width="1.6" filter="url(#cardShadow)"/>
    <rect x="20" y="22" width="70" height="22" rx="11" fill="#FCE8E6"/>
    <text x="55" y="37" font-size="11" font-weight="700" fill="#C5221F" text-anchor="middle" letter-spacing="0.8">DAY 60</text>
    <circle cx="120" cy="78" r="20" fill="#FCE8E6"/>
    <circle cx="116" cy="75" r="7" fill="none" stroke="#EA4335" stroke-width="2"/>
    <line x1="121" y1="80" x2="129" y2="88" stroke="#EA4335" stroke-width="2.4" stroke-linecap="round"/>
    <text x="120" y="124" font-size="18" font-weight="600" fill="#202124" text-anchor="middle">Analyst catches it</text>
    <text x="120" y="148" font-size="12" fill="#5F6368" text-anchor="middle">A regulator-facing</text>
    <text x="120" y="164" font-size="12" fill="#5F6368" text-anchor="middle">reference fails lookup</text>
  </g>

  <line x1="866" y1="260" x2="894" y2="260" stroke="#EA4335" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowRed)"/>

  <!-- AFTER — Fix lands -->
  <g transform="translate(900, 170)">
    <rect width="240" height="180" rx="14" fill="#FFFFFF" stroke="#34A853" stroke-width="1.6" filter="url(#cardShadow)"/>
    <rect x="20" y="22" width="62" height="22" rx="11" fill="#E6F4EA"/>
    <text x="51" y="37" font-size="11" font-weight="700" fill="#137333" text-anchor="middle" letter-spacing="0.8">AFTER</text>
    <circle cx="120" cy="78" r="20" fill="#E6F4EA"/>
    <circle cx="120" cy="78" r="14" fill="none" stroke="#34A853" stroke-width="1.8"/>
    <path d="M 112 78 L 118 84 L 128 72" fill="none" stroke="#34A853" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="124" font-size="18" font-weight="600" fill="#202124" text-anchor="middle">Fix lands</text>
    <text x="120" y="148" font-size="12" fill="#5F6368" text-anchor="middle">Code change takes</text>
    <text x="120" y="164" font-size="12" fill="#5F6368" text-anchor="middle">about an hour</text>
  </g>

  <!-- ============ Bottom callout: the real incident ============ -->
  <g transform="translate(60, 430)">
    <rect width="1080" height="260" rx="18" fill="#FFFFFF" stroke="#E0D7F5" stroke-width="1.6" filter="url(#panelShadow)"/>

    <path d="M 0 18 Q 0 0 18 0 L 1062 0 Q 1080 0 1080 18 L 1080 50 L 0 50 Z" fill="#F3E5F5"/>
    <text x="540" y="32" font-size="11" fill="#673AB7" text-anchor="middle" font-weight="700" letter-spacing="2">THE REAL INCIDENT</text>

    <text x="540" y="100" font-size="28" font-weight="600" fill="#202124" text-anchor="middle" letter-spacing="-0.3">Nobody could answer the ownership question quickly</text>
    <text x="540" y="128" font-size="14" fill="#5F6368" text-anchor="middle" font-style="italic">The fix took an hour. The conversation it triggered took six months.</text>

    <!-- Four root cause chips -->
    <g transform="translate(60, 160)">
      <rect x="0" y="0" width="230" height="62" rx="10" fill="#FAFBFC" stroke="#DADCE0" stroke-width="1"/>
      <circle cx="28" cy="31" r="14" fill="#FCE8E6"/>
      <circle cx="28" cy="28" r="5" fill="none" stroke="#EA4335" stroke-width="1.6"/>
      <path d="M 22 39 Q 28 34 34 39" fill="none" stroke="#EA4335" stroke-width="1.6" stroke-linecap="round"/>
      <text x="54" y="28" font-size="10" font-weight="700" fill="#C5221F" letter-spacing="0.6">OWNERSHIP</text>
      <text x="54" y="46" font-size="12" fill="#202124">Engineer moved teams</text>

      <rect x="246" y="0" width="230" height="62" rx="10" fill="#FAFBFC" stroke="#DADCE0" stroke-width="1"/>
      <circle cx="274" cy="31" r="14" fill="#FEF7E0"/>
      <rect x="267" y="26" width="14" height="11" rx="1" fill="none" stroke="#F9AB00" stroke-width="1.6"/>
      <circle cx="274" cy="22" r="2.5" fill="none" stroke="#F9AB00" stroke-width="1.6"/>
      <text x="300" y="28" font-size="10" font-weight="700" fill="#E37400" letter-spacing="0.6">IDENTITY</text>
      <text x="300" y="46" font-size="12" fill="#202124">Shared service account</text>

      <rect x="492" y="0" width="232" height="62" rx="10" fill="#FAFBFC" stroke="#DADCE0" stroke-width="1"/>
      <circle cx="520" cy="31" r="14" fill="#E8F0FE"/>
      <rect x="513" y="25" width="14" height="9" rx="1" fill="none" stroke="#4285F4" stroke-width="1.6"/>
      <line x1="513" y1="36" x2="527" y2="36" stroke="#4285F4" stroke-width="1.6"/>
      <line x1="516" y1="39" x2="524" y2="39" stroke="#4285F4" stroke-width="1.4"/>
      <text x="546" y="28" font-size="10" font-weight="700" fill="#1A73E8" letter-spacing="0.6">OBSERVABILITY</text>
      <text x="546" y="46" font-size="12" fill="#202124">Infra monitoring only</text>

      <rect x="740" y="0" width="220" height="62" rx="10" fill="#FAFBFC" stroke="#DADCE0" stroke-width="1"/>
      <circle cx="768" cy="31" r="14" fill="#F3E5F5"/>
      <circle cx="768" cy="31" r="9" fill="none" stroke="#673AB7" stroke-width="1.6"/>
      <line x1="768" y1="31" x2="768" y2="26" stroke="#673AB7" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="768" y1="31" x2="772" y2="33" stroke="#673AB7" stroke-width="1.6" stroke-linecap="round"/>
      <text x="794" y="28" font-size="10" font-weight="700" fill="#673AB7" letter-spacing="0.6">CADENCE</text>
      <text x="794" y="46" font-size="12" fill="#202124">No review schedule</text>
    </g>
  </g>

  <text x="600" y="730" font-size="11" fill="#9AA0A6" text-anchor="middle" font-weight="600" letter-spacing="2">FIG. 3</text>
</svg>
