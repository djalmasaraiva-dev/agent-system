<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Google Sans', 'Roboto', -apple-system, system-ui, sans-serif">
  <defs>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#5F6368"/>
    </marker>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="640" fill="#F8F9FA"/>

  <text x="450" y="48" font-size="22" font-weight="500" fill="#202124" text-anchor="middle">From runtime identity to lifecycle governance</text>
  <text x="450" y="72" font-size="13" font-style="italic" fill="#5F6368" text-anchor="middle">How an identity governance layer sits above the Google Cloud agent runtime</text>
  <line x1="410" y1="88" x2="490" y2="88" stroke="#4285F4" stroke-width="2"/>

  <!-- HR system on top -->
  <rect x="340" y="120" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#softShadow)"/>
  <text x="450" y="143" font-size="10" fill="#5F6368" text-anchor="middle" font-weight="600" letter-spacing="1">SYSTEM OF RECORD</text>
  <text x="450" y="163" font-size="14" fill="#202124" text-anchor="middle" font-weight="500">HR — employees, contractors, joiner-mover-leaver events</text>

  <!-- Arrow from HR to IGA -->
  <line x1="450" y1="180" x2="450" y2="210" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrowUp)" transform="rotate(180 450 195)"/>
  <text x="465" y="200" font-size="10" fill="#5F6368" font-style="italic">JML events</text>

  <!-- Layer 2: IGA -->
  <rect x="72" y="220" width="756" height="170" rx="10" fill="#FFFFFF" stroke="#673AB7" stroke-width="1.6" filter="url(#softShadow)"/>
  <rect x="72" y="220" width="756" height="42" rx="10" fill="#673AB7"/>
  <text x="450" y="248" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600" letter-spacing="1.5">LAYER 2 — IDENTITY LIFECYCLE GOVERNANCE</text>

  <text x="450" y="288" font-size="15" fill="#202124" text-anchor="middle" font-weight="500">SailPoint Agent Identity Security  ·  built on SailPoint Atlas  ·  integrated with Identity Security Cloud</text>

  <!-- IGA capability boxes -->
  <rect x="100" y="306" width="170" height="70" rx="6" fill="#F3E5F5" stroke="#673AB7" stroke-width="1"/>
  <text x="185" y="325" font-size="11" fill="#673AB7" text-anchor="middle" font-weight="600">OWNERSHIP &amp; SUCCESSION</text>
  <text x="185" y="345" font-size="11" fill="#5F6368" text-anchor="middle">Human owner per agent</text>
  <text x="185" y="361" font-size="11" fill="#5F6368" text-anchor="middle">Fallback on offboarding</text>

  <rect x="280" y="306" width="170" height="70" rx="6" fill="#F3E5F5" stroke="#673AB7" stroke-width="1"/>
  <text x="365" y="325" font-size="11" fill="#673AB7" text-anchor="middle" font-weight="600">CERTIFICATION</text>
  <text x="365" y="345" font-size="11" fill="#5F6368" text-anchor="middle">Quarterly campaigns</text>
  <text x="365" y="361" font-size="11" fill="#5F6368" text-anchor="middle">Attestation trail</text>

  <rect x="460" y="306" width="170" height="70" rx="6" fill="#F3E5F5" stroke="#673AB7" stroke-width="1"/>
  <text x="545" y="325" font-size="11" fill="#673AB7" text-anchor="middle" font-weight="600">SoD &amp; ACCESS REVIEW</text>
  <text x="545" y="345" font-size="11" fill="#5F6368" text-anchor="middle">Toxic combinations</text>
  <text x="545" y="361" font-size="11" fill="#5F6368" text-anchor="middle">Agent + tool + data paths</text>

  <rect x="640" y="306" width="170" height="70" rx="6" fill="#F3E5F5" stroke="#673AB7" stroke-width="1"/>
  <text x="725" y="325" font-size="11" fill="#673AB7" text-anchor="middle" font-weight="600">UNIFIED GOVERNED VIEW</text>
  <text x="725" y="345" font-size="11" fill="#5F6368" text-anchor="middle">Cross-platform</text>
  <text x="725" y="361" font-size="11" fill="#5F6368" text-anchor="middle">queryable graph</text>

  <!-- Arrows from runtime to IGA -->
  <line x1="252" y1="430" x2="252" y2="395" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrowUp)" transform="rotate(180 252 412.5)"/>
  <line x1="450" y1="430" x2="450" y2="395" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrowUp)" transform="rotate(180 450 412.5)"/>
  <line x1="648" y1="430" x2="648" y2="395" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrowUp)" transform="rotate(180 648 412.5)"/>
  <text x="450" y="412" font-size="10" fill="#5F6368" text-anchor="middle" font-style="italic">native connectors  ·  /.well-known/agent-identity for self-hosted</text>

  <!-- Layer 1: Runtime -->
  <rect x="72" y="438" width="756" height="170" rx="10" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.6" filter="url(#softShadow)"/>
  <rect x="72" y="438" width="756" height="42" rx="10" fill="#4285F4"/>
  <text x="450" y="466" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600" letter-spacing="1.5">LAYER 1 — RUNTIME GOVERNANCE</text>

  <text x="450" y="506" font-size="15" fill="#202124" text-anchor="middle" font-weight="500">Google Cloud — Vertex AI Agent Engine, IAM, Model Armor, Cloud Logging, SCC, Wiz</text>

  <!-- Runtime capability boxes -->
  <rect x="100" y="524" width="170" height="70" rx="6" fill="#E8F0FE" stroke="#4285F4" stroke-width="1"/>
  <text x="185" y="543" font-size="11" fill="#4285F4" text-anchor="middle" font-weight="600">AGENT IDENTITY</text>
  <text x="185" y="563" font-size="11" fill="#5F6368" text-anchor="middle">SPIFFE / IAM principal</text>
  <text x="185" y="579" font-size="11" fill="#5F6368" text-anchor="middle">per Agent Engine</text>

  <rect x="280" y="524" width="170" height="70" rx="6" fill="#E6F4EA" stroke="#34A853" stroke-width="1"/>
  <text x="365" y="543" font-size="11" fill="#34A853" text-anchor="middle" font-weight="600">AUTHORIZATION</text>
  <text x="365" y="563" font-size="11" fill="#5F6368" text-anchor="middle">IAM + A2A</text>
  <text x="365" y="579" font-size="11" fill="#5F6368" text-anchor="middle">least privilege</text>

  <rect x="460" y="524" width="170" height="70" rx="6" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1"/>
  <text x="545" y="543" font-size="11" fill="#F9AB00" text-anchor="middle" font-weight="600">RUNTIME PROTECTION</text>
  <text x="545" y="563" font-size="11" fill="#5F6368" text-anchor="middle">Model Armor</text>
  <text x="545" y="579" font-size="11" fill="#5F6368" text-anchor="middle">prompt + DLP</text>

  <rect x="640" y="524" width="170" height="70" rx="6" fill="#FCE8E6" stroke="#EA4335" stroke-width="1"/>
  <text x="725" y="543" font-size="11" fill="#EA4335" text-anchor="middle" font-weight="600">EVIDENCE</text>
  <text x="725" y="563" font-size="11" fill="#5F6368" text-anchor="middle">Cloud Logging, SCC</text>
  <text x="725" y="579" font-size="11" fill="#5F6368" text-anchor="middle">+ Wiz cross-platform</text>
</svg>
