<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'IBM Plex Sans', -apple-system, system-ui, sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; }
      .sans { font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; }
    </style>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.10"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#FAF6EE"/>

  <!-- Title -->
  <text x="450" y="44" class="serif" font-size="22" font-weight="600" fill="#1A1A1A" text-anchor="middle">Two layers, two scopes</text>
  <text x="450" y="66" class="sans" font-size="13" font-style="italic" fill="#7A6E5C" text-anchor="middle">Where Google's stack ends and partner IGA begins — complementary, not competing</text>
  <line x1="410" y1="82" x2="490" y2="82" stroke="#C9A227" stroke-width="1"/>

  <!-- ===== LAYER 2 (TOP): Identity lifecycle governance ===== -->
  <text x="80" y="130" class="sans" font-size="10" fill="#A89878" letter-spacing="1" font-weight="700">LAYER 2</text>
  
  <!-- Layer 2 container -->
  <rect x="80" y="142" width="740" height="170" rx="6" fill="#FFF8E7" stroke="#C9A227" stroke-width="1.2" filter="url(#softShadow)"/>
  
  <text x="450" y="170" class="serif" font-size="17" font-weight="600" fill="#1A1A1A" text-anchor="middle">Identity lifecycle governance</text>
  <text x="450" y="190" class="sans" font-size="11" font-style="italic" fill="#7A6E5C" text-anchor="middle">Partner IGA platform · anchored in HR · enterprise-grade audit posture</text>
  
  <!-- Components row -->
  <text x="115" y="222" class="sans" font-size="9" fill="#7A6E5C" font-weight="700" letter-spacing="0.6">COMPONENTS</text>
  <rect x="115" y="232" width="160" height="26" rx="13" fill="#FFFFFF" stroke="#C9A227" stroke-width="0.8"/>
  <text x="195" y="249" class="sans" font-size="11" fill="#1A1A1A" text-anchor="middle">Partner IGA platform</text>
  <rect x="285" y="232" width="180" height="26" rx="13" fill="#FFFFFF" stroke="#C9A227" stroke-width="0.8"/>
  <text x="375" y="249" class="sans" font-size="11" fill="#1A1A1A" text-anchor="middle">HR system integration</text>
  <rect x="475" y="232" width="200" height="26" rx="13" fill="#FFFFFF" stroke="#C9A227" stroke-width="0.8"/>
  <text x="575" y="249" class="sans" font-size="11" fill="#1A1A1A" text-anchor="middle">Audit evidence packaging</text>
  <rect x="685" y="232" width="120" height="26" rx="13" fill="#FFFFFF" stroke="#C9A227" stroke-width="0.8"/>
  <text x="745" y="249" class="sans" font-size="11" fill="#1A1A1A" text-anchor="middle">Identity Graph</text>

  <!-- Questions row -->
  <text x="115" y="280" class="sans" font-size="9" fill="#7A6E5C" font-weight="700" letter-spacing="0.6">ANSWERS QUESTIONS LIKE</text>
  <text x="115" y="298" class="sans" font-size="11" fill="#1A1A1A" font-style="italic">"Who owns this agent?"  ·  "Has it been certified in the last 90 days?"  ·  "Does the audit packet meet SOX / BACEN / LGPD?"</text>

  <!-- Connector showing complementarity -->
  <line x1="450" y1="312" x2="450" y2="358" stroke="#C9A227" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="465" y="338" class="sans" font-size="10" fill="#C9A227" font-style="italic" font-weight="600">complementary</text>

  <!-- ===== LAYER 1 (BOTTOM): Runtime governance + cross-platform security ===== -->
  <text x="80" y="376" class="sans" font-size="10" fill="#A89878" letter-spacing="1" font-weight="700">LAYER 1</text>
  
  <!-- Layer 1 container -->
  <rect x="80" y="388" width="740" height="180" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.2" filter="url(#softShadow)"/>
  
  <text x="450" y="416" class="serif" font-size="17" font-weight="600" fill="#1A1A1A" text-anchor="middle">Runtime governance &amp; security posture</text>
  <text x="450" y="436" class="sans" font-size="11" font-style="italic" fill="#7A6E5C" text-anchor="middle">Google Cloud + Wiz · agent identity · IAM policy · runtime protection</text>

  <!-- Components row - Google Cloud native -->
  <text x="115" y="468" class="sans" font-size="9" fill="#7A6E5C" font-weight="700" letter-spacing="0.6">GOOGLE CLOUD NATIVE</text>
  <rect x="115" y="478" width="115" height="26" rx="13" fill="#FAF6EE" stroke="#4A7C7E" stroke-width="0.8"/>
  <text x="172" y="495" class="sans" font-size="11" fill="#1A1A1A" text-anchor="middle">Agent Engine ID</text>
  <rect x="240" y="478" width="115" height="26" rx="13" fill="#FAF6EE" stroke="#4A7C7E" stroke-width="0.8"/>
  <text x="297" y="495" class="sans" font-size="11" fill="#1A1A1A" text-anchor="middle">IAM / A2A</text>
  <rect x="365" y="478" width="135" height="26" rx="13" fill="#FAF6EE" stroke="#4A7C7E" stroke-width="0.8"/>
  <text x="432" y="495" class="sans" font-size="11" fill="#1A1A1A" text-anchor="middle">Cloud Logging</text>
  <rect x="510" y="478" width="115" height="26" rx="13" fill="#FAF6EE" stroke="#4A7C7E" stroke-width="0.8"/>
  <text x="567" y="495" class="sans" font-size="11" fill="#1A1A1A" text-anchor="middle">Model Armor</text>

  <!-- Wiz - cross-platform extension -->
  <text x="640" y="468" class="sans" font-size="9" fill="#7A6E5C" font-weight="700" letter-spacing="0.6">CROSS-PLATFORM</text>
  <rect x="640" y="478" width="170" height="26" rx="13" fill="#FAF6EE" stroke="#1A1A1A" stroke-width="1"/>
  <text x="725" y="495" class="sans" font-size="11" fill="#1A1A1A" text-anchor="middle" font-weight="500">SCC · Wiz posture</text>

  <!-- Questions row -->
  <text x="115" y="528" class="sans" font-size="9" fill="#7A6E5C" font-weight="700" letter-spacing="0.6">ANSWERS QUESTIONS LIKE</text>
  <text x="115" y="546" class="sans" font-size="11" fill="#1A1A1A" font-style="italic">"Who is this agent (cryptographically)?"  ·  "What is it allowed to do at runtime?"  ·  "Is its behavior anomalous?"</text>
  <text x="115" y="562" class="sans" font-size="11" fill="#1A1A1A" font-style="italic">"What's our security posture across clouds?"</text>

  <!-- Bottom tagline -->
  <text x="450" y="600" class="serif" font-size="13" font-style="italic" fill="#7A6E5C" text-anchor="middle">Each layer answers a different question. Both layers are required at production scale.</text>

  <!-- Corner mark -->
  <text x="852" y="600" class="sans" font-size="9" fill="#A89878" text-anchor="end" letter-spacing="0.5">FIG. 3</text>
</svg>
