<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'IBM Plex Sans', -apple-system, system-ui, sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; }
      .sans { font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; }
    </style>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C9A227"/>
    </marker>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.10"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="640" fill="#FAF6EE"/>

  <!-- Title -->
  <text x="450" y="44" class="serif" font-size="22" font-weight="600" fill="#1A1A1A" text-anchor="middle">The portable-identity bridge</text>
  <text x="450" y="66" class="sans" font-size="13" font-style="italic" fill="#7A6E5C" text-anchor="middle">From per-platform identity to a vendor-neutral governance plane</text>
  <line x1="410" y1="82" x2="490" y2="82" stroke="#C9A227" stroke-width="1"/>

  <!-- LAYER 1: Agent platforms -->
  <text x="80" y="124" class="sans" font-size="10" fill="#A89878" letter-spacing="0.8" font-weight="600">LAYER 1</text>
  <text x="80" y="144" class="serif" font-size="14" font-weight="500" fill="#1A1A1A">Agent platforms (each with native identity)</text>

  <!-- Platform cards -->
  <rect x="80" y="162" width="155" height="86" rx="4" fill="#FFFFFF" stroke="#4A7C7E" stroke-width="1.2" filter="url(#softShadow)"/>
  <text x="157" y="184" class="sans" font-size="9" fill="#4A7C7E" text-anchor="middle" font-weight="700" letter-spacing="0.8">AGENT ENGINE</text>
  <text x="157" y="210" class="sans" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="500">data_agent</text>
  <text x="157" y="230" class="sans" font-size="10" fill="#7A6E5C" text-anchor="middle" font-style="italic">IAM principal</text>

  <rect x="245" y="162" width="155" height="86" rx="4" fill="#FFFFFF" stroke="#4A6B8A" stroke-width="1.2" filter="url(#softShadow)"/>
  <text x="322" y="184" class="sans" font-size="9" fill="#4A6B8A" text-anchor="middle" font-weight="700" letter-spacing="0.8">AGENTFORCE</text>
  <text x="322" y="210" class="sans" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="500">customer_history</text>
  <text x="322" y="230" class="sans" font-size="10" fill="#7A6E5C" text-anchor="middle" font-style="italic">Native ID</text>

  <rect x="410" y="162" width="155" height="86" rx="4" fill="#FFFFFF" stroke="#6B5A7E" stroke-width="1.2" filter="url(#softShadow)"/>
  <text x="487" y="184" class="sans" font-size="9" fill="#6B5A7E" text-anchor="middle" font-weight="700" letter-spacing="0.8">COPILOT STUDIO</text>
  <text x="487" y="210" class="sans" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="500">compliance_agent</text>
  <text x="487" y="230" class="sans" font-size="10" fill="#7A6E5C" text-anchor="middle" font-style="italic">Native ID</text>

  <rect x="575" y="162" width="155" height="86" rx="4" fill="#FFFFFF" stroke="#B8893E" stroke-width="1.2" filter="url(#softShadow)"/>
  <text x="652" y="184" class="sans" font-size="9" fill="#B8893E" text-anchor="middle" font-weight="700" letter-spacing="0.8">BEDROCK AGENTCORE</text>
  <text x="652" y="210" class="sans" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="500">notification_agent</text>
  <text x="652" y="230" class="sans" font-size="10" fill="#7A6E5C" text-anchor="middle" font-style="italic">Native ID</text>

  <rect x="740" y="162" width="125" height="86" rx="4" fill="#FFFFFF" stroke="#A89878" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="802" y="184" class="sans" font-size="9" fill="#A89878" text-anchor="middle" font-weight="700" letter-spacing="0.8">CUSTOM / OSS</text>
  <text x="802" y="210" class="sans" font-size="12" fill="#5A5A5A" text-anchor="middle" font-style="italic">custom_agent</text>
  <text x="802" y="230" class="sans" font-size="10" fill="#7A6E5C" text-anchor="middle" font-style="italic">REST endpoint</text>

  <!-- Arrows down to layer 2 -->
  <line x1="157" y1="252" x2="157" y2="296" stroke="#C9A227" stroke-width="1.3" marker-end="url(#arrowGold)"/>
  <line x1="322" y1="252" x2="322" y2="296" stroke="#C9A227" stroke-width="1.3" marker-end="url(#arrowGold)"/>
  <line x1="487" y1="252" x2="487" y2="296" stroke="#C9A227" stroke-width="1.3" marker-end="url(#arrowGold)"/>
  <line x1="652" y1="252" x2="652" y2="296" stroke="#C9A227" stroke-width="1.3" marker-end="url(#arrowGold)"/>
  <line x1="802" y1="252" x2="802" y2="296" stroke="#C9A227" stroke-width="1.3" marker-end="url(#arrowGold)"/>

  <!-- LAYER 2: Bridge -->
  <text x="80" y="284" class="sans" font-size="10" fill="#A89878" letter-spacing="0.8" font-weight="600">LAYER 2</text>

  <!-- Bridge bar -->
  <rect x="80" y="306" width="785" height="92" rx="4" fill="#FFF8E7" stroke="#C9A227" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="472" y="338" class="serif" font-size="17" font-weight="600" fill="#1A1A1A" text-anchor="middle">/.well-known/agent-identity</text>
  <text x="472" y="362" class="sans" font-size="12" fill="#5A5A5A" text-anchor="middle">Portable envelope · owner · classification · lifecycle · native cryptographic ID preserved</text>
  <text x="472" y="382" class="sans" font-size="10" font-style="italic" fill="#7A6E5C" text-anchor="middle">Pydantic · FastAPI · OpenAPI-discoverable · IAM/IAP-protected</text>

  <!-- Arrow down to layer 3 -->
  <line x1="450" y1="402" x2="450" y2="448" stroke="#C9A227" stroke-width="1.5" marker-end="url(#arrowGold)"/>

  <!-- LAYER 3: IGA -->
  <text x="80" y="436" class="sans" font-size="10" fill="#A89878" letter-spacing="0.8" font-weight="600">LAYER 3</text>

  <rect x="130" y="458" width="640" height="142" rx="4" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="450" y="486" class="serif" font-size="17" font-weight="600" fill="#1A1A1A" text-anchor="middle">IGA control plane · Identity Graph</text>
  <line x1="280" y1="496" x2="620" y2="496" stroke="#C9A227" stroke-width="0.8" opacity="0.5"/>

  <!-- Capability pills - row 1 -->
  <rect x="160" y="510" width="125" height="28" rx="14" fill="#FAF6EE" stroke="#7A6E5C" stroke-width="0.8"/>
  <text x="222" y="529" class="sans" font-size="11" fill="#1A1A1A" text-anchor="middle">JML sync · HR</text>

  <rect x="300" y="510" width="120" height="28" rx="14" fill="#FAF6EE" stroke="#7A6E5C" stroke-width="0.8"/>
  <text x="360" y="529" class="sans" font-size="11" fill="#1A1A1A" text-anchor="middle">Certification</text>

  <rect x="435" y="510" width="120" height="28" rx="14" fill="#FAF6EE" stroke="#7A6E5C" stroke-width="0.8"/>
  <text x="495" y="529" class="sans" font-size="11" fill="#1A1A1A" text-anchor="middle">SoD policy</text>

  <rect x="570" y="510" width="130" height="28" rx="14" fill="#FAF6EE" stroke="#7A6E5C" stroke-width="0.8"/>
  <text x="635" y="529" class="sans" font-size="11" fill="#1A1A1A" text-anchor="middle">Audit evidence</text>

  <!-- Capability pills - row 2 -->
  <rect x="225" y="552" width="180" height="28" rx="14" fill="#FAF6EE" stroke="#7A6E5C" stroke-width="0.8"/>
  <text x="315" y="571" class="sans" font-size="11" fill="#1A1A1A" text-anchor="middle">Cross-platform discovery</text>

  <rect x="420" y="552" width="180" height="28" rx="14" fill="#FAF6EE" stroke="#7A6E5C" stroke-width="0.8"/>
  <text x="510" y="571" class="sans" font-size="11" fill="#1A1A1A" text-anchor="middle">Zero standing privilege</text>

  <!-- Corner mark -->
  <text x="852" y="620" class="sans" font-size="9" fill="#A89878" text-anchor="end" letter-spacing="0.5">FIG. 6</text>
</svg>
